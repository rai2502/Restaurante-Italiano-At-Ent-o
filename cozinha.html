<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozinha • La Bella Tavola</title>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        barlow: ['Barlow', 'sans-serif'],
                        playfair: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: '#9b2226',
                        dark: '#1a0a0a',
                        muted: '#888888',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #fdfaf5; }
    </style>
</head>

<body class="font-barlow text-gray-800 w-full m-0 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white border-b shadow-sm py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🍝</span>
            <div>
                <h1 class="font-playfair text-xl font-bold text-primary">La Bella Tavola</h1>
                <p class="text-[11px] text-gray-400 uppercase tracking-widest">Painel da Cozinha</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div id="status-conexao" class="flex items-center gap-2 text-sm font-semibold text-yellow-600">
                <span class="w-2.5 h-2.5 bg-yellow-500 rounded-full animate-pulse"></span>
                Conectando...
            </div>
            <button onclick="carregarPedidos()"
                class="bg-dark text-white px-4 py-2 rounded-lg font-bold hover:bg-black transition">
                Atualizar
            </button>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-grow p-6">
        <div class="max-w-6xl mx-auto">

            <div class="flex justify-between items-center mb-8">
                <h2 class="font-playfair text-3xl font-bold text-dark">Pedidos Recebidos</h2>
                <span id="contador-pedidos"
                    class="bg-primary text-white px-4 py-1 rounded-full text-sm font-bold shadow">
                    0 pedidos
                </span>
            </div>

            <!-- GRID DE PEDIDOS -->
            <div id="pedidos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-muted col-span-full text-center py-10 text-lg">Carregando pedidos...</p>
            </div>

        </div>
    </main>

    <!-- SCRIPT -->
    <script>
        const URL_API = 'https://aula7-sapori-d-italia.vercel.app/api/pedidos';

        async function carregarPedidos() {
            const container = document.getElementById('pedidos-container');
            const contador = document.getElementById('contador-pedidos');
            const status = document.getElementById('status-conexao');

            try {
                status.innerHTML = '<span class="w-2.5 h-2.5 bg-yellow-500 rounded-full animate-pulse"></span> Atualizando...';
                status.className = 'flex items-center gap-2 text-sm font-semibold text-yellow-600';

                const resposta = await fetch(URL_API);
                if (!resposta.ok) throw new Error('Erro ao buscar pedidos');

                const pedidos = await resposta.json();
                renderizarPedidos(pedidos);

                contador.innerText = `${pedidos.length} pedido(s)`;

                setTimeout(() => {
                    status.innerHTML = '<span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span> Online';
                    status.className = 'flex items-center gap-2 text-sm font-semibold text-green-600';
                }, 500);

            } catch (erro) {
                console.error("Erro ao carregar pedidos:", erro);
                container.innerHTML = `
                    <div class="col-span-full bg-red-50 border border-red-300 text-red-700 px-5 py-4 rounded-2xl">
                        <p class="font-bold text-lg mb-1">Ops!</p>
                        <p>Não foi possível carregar os pedidos da nuvem. Verifique a conexão com a API.</p>
                    </div>`;

                status.innerHTML = '<span class="w-2.5 h-2.5 bg-red-500 rounded-full"></span> Offline';
                status.className = 'flex items-center gap-2 text-sm font-semibold text-red-600';
            }
        }

        function renderizarPedidos(pedidos) {
            const container = document.getElementById('pedidos-container');
            container.innerHTML = '';

            if (pedidos.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-16 opacity-40">
                        <span class="text-6xl mb-4">🍽️</span>
                        <p class="font-playfair text-2xl font-bold text-dark">Nenhum pedido pendente.</p>
                        <p class="text-muted mt-1">A cozinha está tranquila por enquanto!</p>
                    </div>`;
                return;
            }

            pedidos.forEach(pedido => {
                let itens = [];
                try {
                    itens = typeof pedido.itens === 'string' ? JSON.parse(pedido.itens) : pedido.itens;
                } catch (e) {
                    console.error("Erro ao converter itens:", e);
                }
                if (!itens || !Array.isArray(itens)) itens = [];

                let htmlItens = itens.map(item => `
                    <li class="flex justify-between border-b border-[#f0e8d8] py-2">
                        <span class="font-semibold text-dark">${item.quantidade || 1}× ${item.nome || 'Item'}</span>
                        <span class="text-muted">R$ ${(item.preco || 0).toFixed(2)}</span>
                    </li>
                `).join('');

                let dataFormatada = 'Horário desconhecido';
                if (pedido.created_at) {
                    const d = new Date(pedido.created_at);
                    dataFormatada = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' — ' + d.toLocaleDateString('pt-BR');
                }

                const card = `
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition duration-300 flex flex-col overflow-hidden">

                        <!-- Topo colorido -->
                        <div class="bg-primary px-5 py-4 flex justify-between items-start">
                            <div>
                                <h3 class="font-playfair text-xl font-bold text-white">Pedido #${pedido.id}</h3>
                                <span class="text-[11px] text-red-200 uppercase tracking-widest">${dataFormatada}</span>
                            </div>
                            <span class="bg-white text-primary text-xs font-black uppercase px-2 py-1 rounded-lg">
                                ${pedido.status || 'Pendente'}
                            </span>
                        </div>

                        <!-- Corpo do card -->
                        <div class="flex flex-col flex-grow p-5">

                            <!-- Cliente e endereço -->
                            <div class="mb-4 bg-[#fdf6ec] p-3 rounded-xl text-sm border border-[#f0e8d8]">
                                <p class="mb-1"><strong>Cliente:</strong> <span class="text-gray-700">${pedido.cliente_nome || 'Não informado'}</span></p>
                                <p><strong>Endereço:</strong> <span class="text-gray-700">${pedido.cliente_endereco || 'Não informado'}</span></p>
                            </div>

                            <!-- Itens -->
                            <div class="flex-grow mb-4">
                                <h4 class="font-bold text-dark mb-2 uppercase text-xs tracking-widest text-muted">Itens do pedido</h4>
                                <ul class="text-sm">${htmlItens}</ul>
                            </div>

                            <!-- Total e botão -->
                            <div class="mt-auto pt-4 border-t border-gray-100 flex justify-between items-center">
                                <div>
                                    <span class="text-xs text-muted font-bold uppercase">Total</span>
                                    <p class="font-black text-xl text-primary">R$ ${(pedido.total || 0).toFixed(2)}</p>
                                </div>
                                <button onclick="concluirPedido(this)"
                                    class="bg-green-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-green-700 transition active:scale-95">
                                    Pronto ✓
                                </button>
                            </div>

                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function concluirPedido(btn) {
            const card = btn.closest('.bg-white');
            card.classList.add('opacity-40', 'grayscale', 'pointer-events-none');
            btn.innerText = 'Finalizado';
            btn.classList.replace('bg-green-600', 'bg-gray-400');
            btn.classList.replace('hover:bg-green-700', 'hover:bg-gray-400');
        }

        // Inicia e atualiza a cada 10 segundos
        carregarPedidos();
        setInterval(carregarPedidos, 10000);
    </script>

</body>
</html>
